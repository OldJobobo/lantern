    </clipPath>
    <filter id="torn-edge" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0025 0.0045" numOctaves="2" seed="29" result="softWave"/>
      <feDisplacementMap in="SourceGraphic" in2="softWave" scale="32" xChannelSelector="R" yChannelSelector="G" result="gentlyWaved"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.075 0.19" numOctaves="3" seed="83" result="edgeNoise"/>
      <feDisplacementMap in="gentlyWaved" in2="edgeNoise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <mask id="sheet-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="2048" height="1536">
      <rect x="68" y="47" width="1909" height="1441" fill="#fff" filter="url(#torn-edge)"/>
    </mask>
  </defs>

  <g>
    <g mask="url(#sheet-mask)">
      <rect x="52" y="34" width="1948" height="1474" fill="url(#paper-tone)"/>
      <rect x="52" y="34" width="1948" height="1474" fill="url(#major-grid)" opacity="0.9" filter="url(#ink-wear)"/>
      <rect x="52" y="34" width="1948" height="1474" fill="url(#edge-age)"/>

      <ellipse cx="168" cy="134" rx="235" ry="180" fill="url(#stain-a)" filter="url(#soft-blur)"/>
      <ellipse cx="1870" cy="1380" rx="285" ry="205" fill="url(#stain-a)" filter="url(#soft-blur)"/>
      <ellipse cx="1685" cy="258" rx="190" ry="118" fill="url(#stain-b)" filter="url(#soft-blur)"/>
      <ellipse cx="552" cy="1220" rx="260" ry="145" fill="url(#stain-b)" filter="url(#soft-blur)"/>

      <g opacity="0.13" fill="none" stroke="#876a45" stroke-linecap="round">
        <path d="M91 390 C230 403 301 389 419 398" stroke-width="2"/>
        <path d="M1731 1463 C1814 1442 1884 1454 1957 1437" stroke-width="2.2"/>
        <path d="M1950 593 C1909 664 1924 740 1945 812" stroke-width="1.8"/>
      </g>

      <rect x="52" y="34" width="1948" height="1474" fill="#ffffff" opacity="0.22" filter="url(#fiber)"/>
    </g>
  </g>
</svg>
