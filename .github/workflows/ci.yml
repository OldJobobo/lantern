name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
      - name: Contract and model tests
        run: ./tests/run
      - name: Validate Qt shader assets
        run: |
          sudo apt-get update
          sudo apt-get install --yes qt6-shader-baker
          /usr/lib/qt6/bin/qsb -o "$RUNNER_TEMP/crt.frag.qsb" shaders/crt.frag
          /usr/lib/qt6/bin/qsb --dump "$RUNNER_TEMP/crt.frag.qsb" >/dev/null
      - name: Verify bundled artifacts
        run: sha256sum -c third_party/SHA256SUMS
      - name: Build bounded reader source
        run: cc -std=c11 -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/read-bounded-file" bin/read-bounded-file.c
      - name: Build corresponding Frotz source
        run: |
          mkdir -p /tmp/lantern-frotz-source
          tar -C /tmp/lantern-frotz-source -xzf third_party/frotz/source/frotz-2.55.tar.gz
          make -C /tmp/lantern-frotz-source/frotz-2.55 PREFIX=/usr dumb
          test -x /tmp/lantern-frotz-source/frotz-2.55/dfrotz
      - name: Smoke bundled interpreter and Zork trilogy
        run: ./tests/smoke-runtime
